[workspace]
resolver = "3"
members = ["crates/core", "crates/workloads", "crates/report", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
authors = ["Piotr Gorski <lucjan.lucjanov@gmail.com>"]
publish = false

[workspace.dependencies]
helicoprion-core = { path = "crates/core" }
helicoprion-workloads = { path = "crates/workloads" }
helicoprion-report = { path = "crates/report" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

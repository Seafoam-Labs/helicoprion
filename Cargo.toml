[workspace]
resolver = "3"
members = ["crates/core", "crates/workloads", "crates/report", "crates/cli"]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
authors = ["Piotr Gorski <lucjan.lucjanov@gmail.com>"]
repository = "https://github.com/Seafoam-Labs/helicoprion"
keywords = ["scheduler", "benchmark", "sched-ext", "eevdf", "linux"]
categories = ["command-line-utilities", "development-tools::profiling"]

[workspace.dependencies]
# The four crates are released together and the libraries have no stable
# API of their own: each depends on exactly the others' version. Keep these
# in step with `workspace.package.version` when bumping.
helicoprion-core = { path = "crates/core", version = "=0.7.0" }
helicoprion-workloads = { path = "crates/workloads", version = "=0.7.0" }
helicoprion-report = { path = "crates/report", version = "=0.7.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# Only for the `png` feature: draws the result card as a picture.
resvg = { version = "0.50", default-features = false, features = ["text", "system-fonts"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

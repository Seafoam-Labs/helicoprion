[package]
name = "helicoprion"
description = "Scheduler-focused CPU benchmark: detects EEVDF vs sched-ext, runs workloads, charts the difference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[[bin]]
name = "helicoprion"
path = "src/main.rs"

[features]
default = ["png"]
# `compare --png` and the card that `matrix` writes next to its report.
# On unless asked otherwise (`--no-default-features`): it brings an SVG
# renderer and a font stack, which a build that only measures can leave out.
png = ["helicoprion-report/png"]

[dependencies]
helicoprion-core.workspace = true
helicoprion-workloads.workspace = true
helicoprion-report.workspace = true
serde_json.workspace = true
clap.workspace = true
anyhow.workspace = true
libc.workspace = true

[lints]
workspace = true
